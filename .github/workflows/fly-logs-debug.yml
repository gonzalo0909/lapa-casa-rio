name: Fly.io logs (debug, read-only)

on:
  workflow_dispatch:

jobs:
  logs:
    name: Inspect deployed admin files
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: |
          flyctl ssh console -a lapa-casa-hostel -C "grep -c block-holiday dist/admin/blocking.html"
          flyctl ssh console -a lapa-casa-hostel -C "grep -c block-holiday dist/admin/js/blocking.js"
          flyctl ssh console -a lapa-casa-hostel -C "grep -n block-unblock-btn dist/admin/blocking.html"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
