# lapa-casa-hostel/backend/docker-compose.yml

version: '3.9'

services:
  # ===========================================
  # BACKEND API
  # ===========================================
  backend:
    container_name: lapa-casa-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lapacasario?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lapa-casa-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("http").get("http://localhost:5000/health")']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================
  # POSTGRESQL DATABASE
  # Primer arranque: DB vacia. Aplicar schema real con
  #   docker compose exec backend node database/scripts/migrate.js
  #   docker compose exec backend node database/scripts/seed.js
  # (no hay init.sql -- el schema completo vive en database/migrations/,
  # ver backend/database/README.md)
  # ===========================================
  postgres:
    container_name: lapa-casa-postgres
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=lapacasario
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lapa-casa-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # REDIS CACHE
  # ===========================================
  redis:
    container_name: lapa-casa-redis
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass ""
    volumes:
      - redis_data:/data
    networks:
      - lapa-casa-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # PRISMA STUDIO (Development only)
  # ===========================================
  prisma-studio:
    container_name: lapa-casa-prisma-studio
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - '5555:5555'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lapacasario?schema=public
    command: npx prisma studio
    depends_on:
      - postgres
    networks:
      - lapa-casa-network
    profiles:
      - tools

  # ===========================================
  # MAILHOG (Email testing - Development)
  # ===========================================
  mailhog:
    container_name: lapa-casa-mailhog
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - lapa-casa-network
    profiles:
      - tools

  # ===========================================
  # PGADMIN (Database UI - Development)
  # ===========================================
  pgadmin:
    container_name: lapa-casa-pgadmin
    image: dpage/pgadmin4:latest
    ports:
      - '5050:80'
    environment:
      - PGADMIN_DEFAULT_EMAIL=lapalandiarj@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - lapa-casa-network
    profiles:
      - tools

  # ===========================================
  # REDIS COMMANDER (Redis UI - Development)
  # ===========================================
  redis-commander:
    container_name: lapa-casa-redis-commander
    image: rediscommander/redis-commander:latest
    ports:
      - '8081:8081'
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - lapa-casa-network
    profiles:
      - tools

# ===========================================
# VOLUMES
# ===========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

# ===========================================
# NETWORKS
# ===========================================
networks:
  lapa-casa-network:
    driver: bridge
    name: lapa-casa-network
