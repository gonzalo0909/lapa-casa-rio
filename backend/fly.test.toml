# fly.toml app configuration file generated for lapa-casa-test on 2026-10-16T05:57:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lapa-casa-test'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'production'

[env]
  API_VERSION = 'v1'
  FRONTEND_URL = 'https://lapacasario.com'
  NODE_ENV = 'production'
  PORT = '5000'
  TIMEZONE = 'America/Sao_Paulo'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
