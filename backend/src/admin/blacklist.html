<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista Negra — Admin Lapa Casa</title>
<link rel="stylesheet" href="/admin/css/admin.css">
<style>
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input[type=text] { flex: 1; min-width: 180px; }
  .filter-tabs { display: flex; gap: 4px; }
  .filter-tab { padding: 6px 14px; border: 1.5px solid var(--border); border-radius: 99px;
                background: var(--surface); font-size: 12px; cursor: pointer; font-weight: 500;
                color: var(--text-muted); }
  .filter-tab.active { border-color: var(--accent); color: var(--accent);
                       background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: var(--text-muted);
       text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px;
       border-bottom: 1px solid var(--border); }
  td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: color-mix(in srgb, var(--accent) 4%, var(--surface)); }

  .badge-blocked   { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px;
                     font-weight: 700; background: #fee2e2; color: #991b1b; }
  .badge-ok        { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px;
                     font-weight: 700; background: #dcfce7; color: #166534; }

  .btn-block   { font-size: 12px; background: none; border: 1px solid var(--danger);
                 color: var(--danger); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; }
  .btn-unblock { font-size: 12px; background: none; border: 1px solid var(--accent);
                 color: var(--accent); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; }
  .btn-block:hover   { background: var(--danger); color: #fff; }
  .btn-unblock:hover { background: var(--accent); color: #fff; }

  .reason-text { font-size: 11px; color: var(--text-muted); margin-top: 2px; max-width: 200px;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex;
                    align-items: center; justify-content: center; z-index: 100; }
  .modal-box { background: var(--surface); border-radius: var(--radius); padding: 24px;
               width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h3 { margin: 0 0 16px; font-size: 16px; }
  .modal-box label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 3px; }
  .modal-box input, .modal-box textarea { width: 100%; margin-bottom: 12px; }
  .modal-box textarea { min-height: 70px; resize: vertical; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .btn-cancel-modal { background: none; border: 1px solid var(--border); color: var(--text-muted); }

  .empty { color: var(--text-muted); font-size: 13px; padding: 24px 0; text-align: center; }
  .pagination { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 13px; }
  .pagination button { padding: 5px 12px; }
  .pagination span { color: var(--text-muted); }
</style>
</head>
<body>
<div id="nav-root"></div>
<main>

<div id="page-msg"></div>

<div class="card">
  <h2>Huespedes</h2>

  <div class="toolbar">
    <input type="text" id="search-input" placeholder="Buscar por nombre o email...">
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">Todos</button>
      <button class="filter-tab" data-filter="true">Bloqueados</button>
      <button class="filter-tab" data-filter="false">Activos</button>
    </div>
  </div>

  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Email</th>
          <th>Tel.</th>
          <th>Pais</th>
          <th>Reservas</th>
          <th>Estado</th>
          <th>Motivo</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="guests-body">
        <tr><td colspan="8" class="empty">Cargando...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination" id="pagination" style="display:none">
    <button id="prev-btn">Anterior</button>
    <span id="page-info"></span>
    <button id="next-btn">Siguiente</button>
  </div>
</div>

<!-- Modal de bloqueo -->
<div class="modal-backdrop" id="block-modal" style="display:none">
  <div class="modal-box">
    <h3 id="modal-title">Bloquear huesped</h3>
    <label>Motivo</label>
    <input type="text" id="modal-reason" placeholder="Ej: Dano en la propiedad, Mal comportamiento...">
    <label>Notas internas</label>
    <textarea id="modal-notes" placeholder="Detalle adicional para el equipo..."></textarea>
    <div class="modal-actions">
      <button class="btn-cancel-modal" id="modal-cancel">Cancelar</button>
      <button id="modal-confirm" style="background:var(--danger);color:#fff;border:none">Bloquear</button>
    </div>
  </div>
</div>

</main>
<script src="/admin/js/api.js"></script>
<script src="/admin/js/nav.js"></script>
<script src="/admin/js/blacklist.js"></script>
</body>
</html>
