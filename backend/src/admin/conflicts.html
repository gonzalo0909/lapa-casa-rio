<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conflictos — Admin Lapa Casa Hostel</title>
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

<div id="nav-root"></div>
<main>
  <div class="card">
    <h2>Conflictos de overbooking entre canales</h2>
    <div class="filters">
      <select id="status-filter">
        <option value="">Todos</option>
        <option value="open">Abiertos</option>
        <option value="resolved_auto">Resueltos automáticamente</option>
        <option value="resolved_manual">Resueltos manualmente</option>
      </select>
      <button id="refresh-btn">Actualizar</button>
    </div>
    <div id="conflicts-msg"></div>
    <div class="conflict-list" id="conflict-list"></div>
  </div>
</main>

<script src="/admin/js/api.js"></script>
<script src="/admin/js/nav.js"></script>
<script src="/admin/js/conflicts.js"></script>
</body>
</html>
