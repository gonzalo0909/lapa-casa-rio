<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hostel — Admin Lapa Casa</title>
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

<div id="nav-root"></div>
<main>

  <div class="inner-tab-bar">
    <button class="inner-tab-btn active" data-tab="cuartos">Cuartos</button>
    <button class="inner-tab-btn" data-tab="bloqueos">Bloqueos</button>
    <button class="inner-tab-btn" data-tab="periodos">Períodos especiales</button>
    <button class="inner-tab-btn" data-tab="ofertas">Ofertas</button>
    <button class="inner-tab-btn" data-tab="preciosdin">Precios dinámicos</button>
    <button class="inner-tab-btn" data-tab="precios">Precios</button>
  </div>

  <div class="inner-panel active" id="panel-cuartos">
    <div class="card">
      <h2>Cuartos del hostel</h2>
      <div id="rooms-msg"></div>
      <div class="room-list" id="room-list"></div>
    </div>
  </div>

  <div class="inner-panel" id="panel-bloqueos">
    <iframe class="embed-frame" src="/admin/blocking.html?type=hostel&embed=1"></iframe>
  </div>

  <div class="inner-panel" id="panel-periodos">
    <iframe class="embed-frame" src="/admin/special-periods.html?type=hostel&embed=1"></iframe>
  </div>

  <div class="inner-panel" id="panel-ofertas">
    <iframe class="embed-frame" src="/admin/offers.html?type=hostel&embed=1"></iframe>
  </div>

  <div class="inner-panel" id="panel-preciosdin">
    <iframe class="embed-frame" src="/admin/dynamic-pricing.html?type=hostel&embed=1"></iframe>
  </div>

  <div class="inner-panel" id="panel-precios">
    <iframe class="embed-frame" src="/admin/pricing.html?embed=1"></iframe>
  </div>

</main>

<script src="/admin/js/api.js"></script>
<script src="/admin/js/nav.js"></script>
<script src="/admin/js/rooms.js"></script>
</body>
</html>
