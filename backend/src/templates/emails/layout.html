<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{emailTitle}}</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background-color:#F5F0E8;font-family:'Inter',Arial,Helvetica,sans-serif;color:#1A1610;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F0E8;padding:28px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#FFFDF8;border-radius:10px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);">
          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(160deg,#2C4A8C,#1E3578);padding:28px 36px;">
              <span style="font-family:'Cormorant Garamond',Georgia,serif;color:#FFFFFF;font-size:26px;font-weight:600;letter-spacing:0.02em;">Lapa Casa</span>
              <span style="display:block;font-family:'Inter',Arial,sans-serif;font-size:10px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.6);margin-top:3px;">Santa Teresa · Rio de Janeiro</span>
            </td>
          </tr>
          <!-- Content -->
          <tr>
            <td style="padding:36px 36px 28px;">
              {{contentHtml}}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:20px 36px 24px;background-color:#F5F0E8;border-top:1px solid #DDD9CF;">
              <p style="margin:0 0 3px;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#A0700A;">Lapa Casa</p>
              <a href="https://www.lapacasario.com" style="font-size:12px;color:#6B6560;text-decoration:none;">lapacasario.com</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
