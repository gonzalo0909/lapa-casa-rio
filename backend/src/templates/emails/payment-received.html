<!-- lapa-casa-hostel/backend/src/templates/emails/payment-received.html -->
<h1 style="margin:0 0 16px;font-size:22px;color:#1a1a1a;">{{labelTitle}}</h1>
<p style="margin:0 0 20px;font-size:15px;line-height:1.6;">{{labelGreeting}} {{guestName}},</p>
<p style="margin:0 0 24px;font-size:15px;line-height:1.6;">{{labelIntro}}</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#eefaf0;border-radius:6px;margin-bottom:24px;border:1px solid #b9e6c2;">
  <tr><td style="padding:16px 20px;">
    <p style="margin:0 0 8px;font-size:14px;"><strong>{{labelReservation}}:</strong> {{reservationNumber}}</p>
    <p style="margin:0;font-size:14px;"><strong>{{labelAmountPaid}}:</strong> {{amountFormatted}}</p>
  </td></tr>
</table>

{{remainingSectionHtml}}

<p style="margin:24px 0 0;font-size:15px;line-height:1.6;">{{labelThanks}}</p>
