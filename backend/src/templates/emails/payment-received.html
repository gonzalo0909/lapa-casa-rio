<!-- lapa-casa-hostel/backend/src/templates/emails/payment-received.html -->
<h1 style="margin:0 0 16px;font-size:26px;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:#1A1610;letter-spacing:0.01em;">{{labelTitle}}</h1>
<p style="margin:0 0 14px;font-size:15px;line-height:1.6;font-family:'Inter',Arial,sans-serif;">{{labelGreeting}} {{guestName}},</p>
<p style="margin:0 0 10px;font-size:17px;line-height:1.6;font-weight:600;color:#2C4A8C;font-family:'Cormorant Garamond',Georgia,serif;">{{labelWelcome}}</p>
<p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#6A6058;font-family:'Inter',Arial,sans-serif;">{{labelIntro}}</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#eefaf0;border-radius:6px;margin-bottom:24px;border:1px solid #b9e6c2;">
  <tr><td style="padding:16px 20px;">
    <p style="margin:0 0 8px;font-size:14px;"><strong>{{labelReservation}}:</strong> {{reservationNumber}}</p>
    <p style="margin:0;font-size:14px;"><strong>{{labelAmountPaid}}:</strong> {{amountFormatted}}</p>
  </td></tr>
</table>

{{addressHtml}}

{{remainingSectionHtml}}

<p style="margin:24px 0 0;font-size:15px;line-height:1.6;">{{labelThanks}}</p>
