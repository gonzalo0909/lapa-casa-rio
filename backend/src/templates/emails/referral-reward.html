<h1 style="margin:0 0 16px;font-size:22px;color:#1a1a1a;">{{labelTitle}}</h1>
<p style="margin:0 0 20px;font-size:15px;line-height:1.6;">{{labelGreeting}} {{guestName}},</p>
<p style="margin:0 0 24px;font-size:15px;line-height:1.6;">{{labelIntro}}</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f7f7;border-radius:6px;margin-bottom:24px;">
  <tr><td style="padding:20px 24px;text-align:center;">
    <p style="margin:0 0 8px;font-size:13px;color:#666666;">{{labelBody}}</p>
    <p style="margin:0;font-size:24px;font-weight:bold;letter-spacing:2px;color:#1a1a1a;">{{rewardCode}}</p>
  </td></tr>
</table>

{{rewardButtonHtml}}

<p style="margin:24px 0 0;font-size:13px;color:#777777;">{{labelClosing}}</p>
