<!-- lapa-casa-hostel/backend/src/templates/emails/referral-reward.html -->
<h1 style="margin:0 0 16px;font-size:26px;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:#1A1610;letter-spacing:0.01em;">{{labelTitle}}</h1>
<p style="margin:0 0 20px;font-size:15px;line-height:1.6;font-family:'Inter',Arial,sans-serif;">{{labelGreeting}} {{guestName}},</p>
<p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#6A6058;font-family:'Inter',Arial,sans-serif;">{{labelIntro}}</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fff8f0;border-radius:8px;margin-bottom:24px;border:2px solid #F0B429;">
  <tr><td style="padding:20px 24px;text-align:center;">
    <p style="margin:0 0 8px;font-size:13px;color:#92400e;font-family:'Inter',Arial,sans-serif;">{{labelBody}}</p>
    <p style="margin:0;font-size:28px;font-weight:600;letter-spacing:4px;color:#2C4A8C;font-family:'Cormorant Garamond',Georgia,serif;">{{rewardCode}}</p>
  </td></tr>
</table>

{{rewardButtonHtml}}

<p style="margin:24px 0 0;font-size:13px;color:#777777;">{{labelClosing}}</p>
