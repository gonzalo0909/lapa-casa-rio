# lapa-casa-hostel/docs/api/openapi.yaml
#
# Sección 8 auditoría de 17 secciones: reescrito por completo. El archivo
# anterior documentaba solo 8 endpoints inventados (paths y campos que no
# coincidían con el código real, ej. BookingRequest.guest.name en vez de
# firstName/lastName, /api/availability/check como POST cuando en
# realidad es GET con query params) bajo el prefijo /api/ en vez de
# /api/v1/, y terminaba con un vestigio de generación con IA pegado al
# final del archivo ("✅ Archivo 181/184 completado") que además lo
# dejaba con un error de sintaxis YAML.
#
# Cobertura: se listan TODAS las rutas reales (comparado contra
# backend/src/routes/index.ts y cada sub-router). Los endpoints públicos
# de mayor tráfico (rooms, availability, bookings, payments, webhooks)
# tienen request/response detallados y verificados contra el código.
# Los ~60 endpoints de /admin/* (protegidos, uso interno del panel
# admin) están documentados con path, método y resumen reales, pero con
# schemas de request/response genéricos -- documentarlos en el mismo
# nivel de detalle es un trabajo aparte, de alcance mucho mayor.

openapi: 3.0.3
info:
  title: Lapa Casa Hostel - Channel Manager API
  description: |
    Documentación de la API del sistema de reservas y channel manager de
    Lapa Casa Hostel.

    ## Autenticación
    Las rutas bajo /admin/* requieren un JWT (cookie httpOnly `lch_admin`
    o header `Authorization: Bearer <token>`), obtenido via
    POST /admin/login. El resto de las rutas son públicas.

    ## Rate limiting
    Cada grupo de rutas tiene su propio límite (ver rate-limit.md o
    routes/index.ts) -- desde 3 req/seg en /bookings hasta 120 req/min
    en /availability.
  version: 1.0.0
  contact:
    name: Lapa Casa Hostel Tech Team
    email: lapalandiarj@gmail.com
    url: https://lapacasario.com
  license:
    name: Proprietary

servers:
  - url: https://api.lapacasario.com/api/v1
    description: Producción (aún no desplegado bajo este dominio -- ver sección 11 de la auditoría de 17 secciones)
  - url: http://localhost:3001/api/v1
    description: Desarrollo local

tags:
  - name: Rooms
    description: Información de habitaciones del hostel
  - name: Availability
    description: Disponibilidad y cotización de precio
  - name: Bookings
    description: Creación y gestión de reservas (hostel)
  - name: Payments
    description: Pagos (Stripe, Mercado Pago/PIX) y pago grupal
  - name: Offers
    description: Validación de cupones/ofertas de apartamentos
  - name: Partners
    description: Contacto de administradores de propiedades interesados
  - name: Photos
    description: Galería pública de fotos de huéspedes
  - name: iCal
    description: Import/export de calendarios (Airbnb, Hostelworld, Booking.com)
  - name: Webhooks
    description: Webhooks entrantes de proveedores de pago y OTAs
  - name: Admin Auth
    description: Login/logout del panel admin
  - name: Admin
    description: Panel admin (protegido, requiere rol admin)
  - name: Owner Auth
    description: Login/logout del panel de administradores de apartamento
  - name: Owner Panel
    description: >-
      Panel de administradores de apartamento (protegido, requiere rol owner
      -- cada uno ve solo sus propios apartamentos, filtrado por owner_id)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: También aceptado como cookie httpOnly `lch_admin`
    ownerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT de administrador de apartamento (role owner), separado del admin
        único de arriba. También aceptado como cookie httpOnly `lch_owner`.

  schemas:
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data: {}
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Reserva no encontrada
        timestamp:
          type: string
          format: date-time

    Room:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Mixto 12A
        capacity:
          type: integer
          example: 12
        type:
          type: string
          enum: [mixed, female]
        basePrice:
          type: number
          example: 60.00
        isFlexible:
          type: boolean

    AvailabilityQuoteRequest:
      type: object
      required: [checkIn, checkOut, rooms]
      properties:
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        rooms:
          type: array
          items:
            type: object
            required: [roomId, bedsCount]
            properties:
              roomId:
                type: string
              bedsCount:
                type: integer

    BookingCreateRequest:
      type: object
      required: [checkIn, checkOut, rooms, guest]
      properties:
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        rooms:
          type: array
          minItems: 1
          items:
            type: object
            required: [roomId, bedsCount]
            properties:
              roomId:
                type: string
              bedsCount:
                type: integer
                minimum: 1
        guest:
          type: object
          required: [firstName, lastName, email]
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
              format: email
            phone:
              type: string
            country:
              type: string
        specialRequests:
          type: string
        language:
          type: string
          enum: [pt, en, es]

    PaymentIntentRequest:
      type: object
      required: [reservationId, paymentType, provider]
      properties:
        reservationId:
          type: string
        paymentType:
          type: string
          enum: [deposit, remaining]
        provider:
          type: string
          enum: [stripe, mercadopago]
        currency:
          type: string
          default: BRL
        installments:
          type: integer
          description: Solo con provider=mercadopago y currency=BRL, máximo 12.

paths:
  # ── Rooms ──────────────────────────────────────────────────────────────
  /rooms:
    get:
      tags: [Rooms]
      summary: Lista todos los tipos de habitación
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Room' }

  /rooms/flexible/status:
    get:
      tags: [Rooms]
      summary: Estado de conversión de la habitación Flexible 7
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { description: OK }

  /rooms/{id}:
    get:
      tags: [Rooms]
      summary: Detalle de una habitación
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: No encontrada, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /rooms/{id}/amenities:
    get:
      tags: [Rooms]
      summary: Amenities de una habitación
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }

  /rooms/{id}/photos:
    get:
      tags: [Rooms]
      summary: Fotos de una habitación
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }

  # ── Availability ───────────────────────────────────────────────────────
  /availability/check:
    get:
      tags: [Availability]
      summary: Verifica disponibilidad de camas para un rango de fechas
      parameters:
        - { name: checkIn, in: query, required: true, schema: { type: string, format: date } }
        - { name: checkOut, in: query, required: true, schema: { type: string, format: date } }
        - { name: beds, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '400': { description: Parámetros inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /availability/carnival-dates:
    get:
      tags: [Availability]
      summary: Fechas de Carnaval configuradas (system_config.carnival_dates)
      responses:
        '200': { description: OK }

  /availability/apartments:
    get:
      tags: [Availability]
      summary: Disponibilidad de los 10 apartamentos para un rango de fechas
      parameters:
        - { name: checkIn, in: query, required: true, schema: { type: string, format: date } }
        - { name: checkOut, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: OK }

  /availability/room/{roomId}:
    get:
      tags: [Availability]
      summary: Disponibilidad de una habitación puntual
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }

  /availability/quote:
    post:
      tags: [Availability]
      summary: Cotiza el precio real (mismo cálculo que usa la creación de reserva)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityQuoteRequest' }
      responses:
        '200': { description: OK }
        '400': { description: Faltan campos requeridos, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /availability/calendar:
    get:
      tags: [Availability]
      summary: Vista de calendario de disponibilidad
      responses:
        '200': { description: OK }

  /availability/summary:
    get:
      tags: [Availability]
      summary: Resumen agregado de disponibilidad
      responses:
        '200': { description: OK }

  # ── Bookings ───────────────────────────────────────────────────────────
  /bookings:
    post:
      tags: [Bookings]
      summary: Crea una reserva de hostel
      description: Aplica automáticamente descuento por grupo y multiplicador de temporada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingCreateRequest' }
      responses:
        '201':
          description: Reserva creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }
        '400': { description: Datos inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Camas no disponibles para esas fechas, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    get:
      tags: [Bookings]
      summary: Lista reservas (uso interno/admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /bookings/{id}:
    get:
      tags: [Bookings]
      summary: Detalle de una reserva
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: No encontrada, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    patch:
      tags: [Bookings]
      summary: Actualiza una reserva
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
    delete:
      tags: [Bookings]
      summary: Cancela una reserva
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancelada }
        '404': { description: No encontrada }

  /bookings/{id}/confirmation:
    get:
      tags: [Bookings]
      summary: Datos de confirmación de una reserva (para la página de éxito)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }

  # ── Payments ───────────────────────────────────────────────────────────
  /payments/intent:
    post:
      tags: [Payments]
      summary: Crea un payment intent (depósito o saldo) contra una reserva existente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentIntentRequest' }
      responses:
        '201': { description: Payment intent creado }
        '400': { description: Reserva cancelada / cuotas inválidas, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Reserva no encontrada, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: El depósito ya fue pagado, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /payments/confirm:
    post:
      tags: [Payments]
      summary: Confirma un pago por su paymentId (uso administrativo/manual)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentId]
              properties:
                paymentId: { type: string }
      responses:
        '200': { description: OK }

  /payments/deposit:
    post:
      tags: [Payments]
      summary: Procesa el pago de depósito de una reserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservationId, provider]
              properties:
                reservationId: { type: string }
                provider: { type: string, enum: [stripe, mercadopago] }
                installments: { type: integer, default: 1 }
      responses:
        '200': { description: OK }

  /payments/stripe-wa-link:
    post:
      tags: [Payments]
      summary: Genera un link de Stripe Checkout sin reserva previa (flujo WhatsApp)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountBRL]
              properties:
                amountBRL: { type: number, minimum: 0.01 }
                description: { type: string }
                guestEmail: { type: string, format: email }
                frontendUrl: { type: string, format: uri }
      responses:
        '200': { description: Link generado }
        '400': { description: Body inválido, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /payments/stripe-checkout:
    post:
      tags: [Payments]
      summary: Genera una Stripe Checkout Session para una reserva ya creada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservationId]
              properties:
                reservationId: { type: string }
                frontendUrl: { type: string, format: uri }
      responses:
        '200': { description: Checkout Session creada }
        '404': { description: Reserva no encontrada, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /payments/group-session:
    post:
      tags: [Payments]
      summary: El titular crea una sesión de pago grupal (2+ camas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkIn, checkOut, totalBeds, nights, titular]
              properties:
                checkIn: { type: string, format: date }
                checkOut: { type: string, format: date }
                totalBeds: { type: integer, minimum: 2 }
                nights: { type: integer }
                guestGender: { type: string, enum: [mixed, female, male] }
                titular:
                  type: object
                  required: [full_name, email]
                  properties:
                    full_name: { type: string }
                    email: { type: string, format: email }
                    phone: { type: string }
                    country: { type: string }
                    language: { type: string }
                specialRequests: { type: string }
      responses:
        '201': { description: Sesión creada }
        '400': { description: Faltan campos / menos de 2 camas, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /payments/group/{token}:
    get:
      tags: [Payments]
      summary: Estado general de la sesión de pago grupal (vista del titular)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Sesión no encontrada, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /payments/group/{token}/pay:
    post:
      tags: [Payments]
      summary: Un invitado reclama y paga su propio slot dentro de la sesión grupal
      description: >-
        Auditoría 17 secciones, sección 8: reemplaza a
        `/payments/group-member/{memberToken}` y
        `/payments/group-member/{memberToken}/pay`, que documentaban rutas
        que nunca existieron en el código (el token es único por sesión
        grupal, no hay un `memberToken` separado — ver
        `routes/payments/payments.routes.ts:163`).
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guest, paymentMethod, documentPhotoBase64]
              properties:
                guest:
                  type: object
                  required: [full_name, email]
                  properties:
                    full_name: { type: string }
                    email: { type: string, format: email }
                    phone: { type: string }
                    country: { type: string }
                    language: { type: string }
                paymentMethod: { type: string, enum: [card, pix] }
                documentPhotoBase64: { type: string, description: 'Foto del documento como data URL, obligatoria' }
      responses:
        '200': { description: Pago iniciado }
        '409': { description: 'Sesión expirada, cerrada, o slot ya pagado/reclamado', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /payments/release-deposit:
    post:
      tags: [Payments]
      summary: Libera el 25% retenido al administrador del apartamento (solo admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservationId]
              properties:
                reservationId: { type: string }
      responses:
        '200': { description: OK }

  /payments/mark-received-at-desk:
    post:
      tags: [Payments]
      summary: Registra un pago físico (InfinityPay/efectivo) recibido en recepción (solo admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /payments/{id}/status:
    get:
      tags: [Payments]
      summary: Estado de un pago por su id
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Pago no encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /payments/reservation/{reservationId}:
    get:
      tags: [Payments]
      summary: Historial de pagos de una reserva (total pagado/pendiente/saldo restante)
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Reserva no encontrada, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  # ── Offers / Partners / Photos ───────────────────────────────────────────
  /offers/validate:
    post:
      tags: [Offers]
      summary: Valida un cupón de descuento para apartamentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                apartmentId: { type: string }
                checkIn: { type: string, format: date }
      responses:
        '200': { description: Cupón válido }
        '404': { description: Cupón no encontrado/inválido, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /partners/contact:
    post:
      tags: [Partners]
      summary: Formulario de contacto de administradores de propiedad interesados en asociarse
      description: Rate limit estricto (5/hora) -- endpoint público sin login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, property]
              properties:
                name: { type: string, maxLength: 200 }
                email: { type: string, format: email, maxLength: 200 }
                phone: { type: string, maxLength: 50 }
                property: { type: string, maxLength: 300 }
                message: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Mensaje enviado }
        '400': { description: Validación fallida, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /photos:
    get:
      tags: [Photos]
      summary: Galería pública de fotos de huéspedes
      responses:
        '200': { description: OK }

  # ── iCal / Channel Manager ─────────────────────────────────────────────
  /ical/export:
    get:
      tags: [iCal]
      summary: Exporta el calendario completo (todas las habitaciones) en formato iCal
      description: Público, sin auth -- pensado para pegar como URL de "calendario a importar" en Airbnb/Hostelworld/Booking.
      responses:
        '200': { description: 'OK (text/calendar)' }

  /ical/export/{roomId}:
    get:
      tags: [iCal]
      summary: Exporta el calendario iCal de una habitación puntual
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'OK (text/calendar)' }

  /ical/feeds:
    get:
      tags: [iCal]
      summary: Lista los feeds de importación configurados (solo admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /ical/import/config:
    post:
      tags: [iCal]
      summary: Configura un nuevo feed de importación iCal (solo admin)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Feed creado }

  /ical/feeds/{id}:
    patch:
      tags: [iCal]
      summary: Actualiza un feed de importación
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
    delete:
      tags: [iCal]
      summary: Elimina un feed de importación
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Eliminado }

  /ical/sync:
    post:
      tags: [iCal]
      summary: Dispara una sincronización manual de todos los feeds
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Sincronizado }

  /ical/status:
    get:
      tags: [iCal]
      summary: Estado de la última sincronización de cada feed
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  # ── Webhooks ───────────────────────────────────────────────────────────
  /payments/webhook/stripe:
    post:
      tags: [Webhooks]
      summary: Webhook de Stripe
      description: |
        Verifica la firma con el body crudo (req.rawBody) y
        STRIPE_WEBHOOK_SECRET -- no requiere autenticación de usuario,
        la seguridad es la firma de Stripe.
      responses:
        '200': { description: Procesado }
        '401': { description: Firma inválida }

  /payments/webhook/mercadopago:
    post:
      tags: [Webhooks]
      summary: Webhook de Mercado Pago
      description: Verifica el header X-Signature (HMAC SHA256) contra MP_WEBHOOK_SECRET.
      responses:
        '200': { description: 'Procesado (siempre 200, incluso en error, para que MP no reintente indefinidamente)' }
        '401': { description: Firma inválida o ausente }

  /webhooks/booking:
    post:
      tags: [Webhooks]
      summary: Webhook de Booking.com
      description: Requiere header X-Api-Key y, según configuración, X-Signature + allowlist de IPs.
      security: []
      responses:
        '200': { description: Procesado }
        '401': { description: API key/firma inválida }

  /webhooks/expedia:
    post:
