      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Creada } }

  /owner/apartments/reviews/{reviewId}:
    put:
      tags: [Owner Panel]
      summary: Edita una reseña
      security: [{ ownerAuth: [] }]
      parameters: [{ name: reviewId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
    delete:
      tags: [Owner Panel]
      summary: Elimina una reseña
      security: [{ ownerAuth: [] }]
      parameters: [{ name: reviewId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Eliminada } }

  /owner/apartments/{id}/blocks:
    get:
      tags: [Owner Panel]
      summary: Lista bloqueos de fechas de un apartamento propio
      security: [{ ownerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
    post:
      tags: [Owner Panel]
      summary: Bloquea un rango de fechas (mantenimiento, uso personal, etc.)
      description: >-
        Auditoría 17 secciones, sección 2: devuelve 409 si el rango se
        superpone con una reserva confirmada o pendiente de pago existente
        (ver owner-apartments.routes.ts) -- ya no se puede bloquear encima de
        un huésped con reserva activa.
      security: [{ ownerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date, end_date]
              properties:
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                block_type: { type: string }
                reason: { type: string }
                notes: { type: string }
      responses:
        '201': { description: Creado }
        '400': { description: 'Fecha de fin no posterior a la de inicio', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: 'Hay una reserva confirmada/pendiente en ese rango', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /owner/apartments/blocks/{blockId}:
    delete:
      tags: [Owner Panel]
      summary: Elimina un bloqueo de fechas
      security: [{ ownerAuth: [] }]
      parameters: [{ name: blockId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Eliminado } }

  /owner/apartments/{id}/pricing:
    get:
      tags: [Owner Panel]
      summary: Configuración de precios/unidad de un apartamento propio
      security: [{ ownerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
    put:
      tags: [Owner Panel]
      summary: Edita configuración de precios/unidad de un apartamento propio
      security: [{ ownerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
