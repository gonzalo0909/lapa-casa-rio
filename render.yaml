# lapa-casa-hostel/render.yaml

services:
  # Backend API Service
  - type: web
    name: lapa-casa-hostel-api
    env: node
    # Render no ofrece region en Sudamerica; Oregon es la mas cercana
    # disponible, con latencia extra hacia Supabase (sa-east-1) y los
    # usuarios reales en Rio de Janeiro -- limitacion conocida, no un bug.
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # DATABASE_URL real de Supabase (proyecto rpowardrcwnhbkzjsiok) --
      # sync: false = se carga a mano desde el dashboard de Render, nunca
      # se commitea en este archivo (ver incidente de seguridad previo:
      # una version anterior tenia la contrasena real en texto plano en
      # prompts/combo-VENTANA-1-completa.md).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PORT
        value: 10000
      # ventana6: apuntan al servicio de landing real (lapa-casa-hostel-landing,
      # ver mas abajo), no al frontend Next.js que se elimino de este archivo
      # (ver comentario en ese servicio). Actualizar a los dominios custom
      # (https://lapacasahostel.com / https://api.lapacasahostel.com) una vez
      # esten atados en el dashboard de Render (Settings -> Custom Domains,
      # ver docs/DEPLOY.md) -- mientras tanto usar el *.onrender.com real.
      - key: CORS_ORIGINS
        value: https://lapa-casa-hostel-landing.onrender.com
      - key: APP_URL
        value: https://lapa-casa-hostel-api.onrender.com
      - key: FRONTEND_URL
        value: https://lapa-casa-hostel-landing.onrender.com
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: reservas@lapacasahostel.com
      - key: EMAIL_FROM
        value: reservas@lapacasahostel.com
      - key: EMAIL_FROM_NAME
        value: Lapa Casa Hostel
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # ventana4 (bloque 2): Google Sheets, exportacion de solo lectura hacia
      # afuera. Sin estas 3 variables la exportacion queda deshabilitada sin
      # romper el resto del backend (ver backend/.env.example para el paso
      # a paso de como generarlas).
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      # ventana4 (bloque 2): debe coincidir EXACTO con el nombre de la
      # pestaña real en Google Sheets -- "Hoja 1" es el nombre por
      # defecto que Google le pone a la primera pestaña en cuentas en
      # español (no "Sheet1"). Verificado contra la hoja real del hostel.
      - key: GOOGLE_SHEETS_SHEET_NAME
        value: Hoja 1
    autoDeploy: true

  # Landing estatica del dominio raiz (Ventana 6)
  #
  # El "Frontend Service" que estaba aca antes apuntaba a `frontend/`
  # (Next.js con App Router) con `staticPublishPath: ./dist` y
  # `env: static` -- no compila: `frontend/src` solo tiene componentes
  # sueltos, no existe `app/` ni `pages/` (Next.js falla el build con
  # "Couldn't find any pages"), y aunque compilara, el output real de
  # Next.js es `.next` (ademas requiere un servidor Node para
  # `output: 'standalone'`, no un sitio estatico). Ese frontend es el
  # trabajo de Fase 2 (ver Maestro, "LO QUE QUEDA PARA EL FUTURO"),
  # todavia no listo para desplegarse. Mientras tanto el dominio raiz
  # sirve la landing estatica de `public/landing/` (entregable 2 de
  # esta ventana): info de contacto + links directos a las OTAs.
  - type: web
    name: lapa-casa-hostel-landing
    env: static
    rootDir: public/landing
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    autoDeploy: true

# No hay bloque "databases": la base es la Supabase real
# (proyecto rpowardrcwnhbkzjsiok), no una base gestionada por Render.
# DATABASE_URL se carga a mano en el dashboard (ver envVars del backend).
#
# Dominios custom (lapacasahostel.com -> landing, api.lapacasahostel.com
# -> backend) se atan a mano en el dashboard de Render por servicio
# (Settings -> Custom Domains) -- Render no soporta asignarlos desde este
# archivo. Ver docs/DEPLOY.md.
