# lapa-casa-hostel/render.yaml

services:
  # Backend API Service
  - type: web
    name: lapa-casa-hostel-api
    env: node
    # Render no ofrece region en Sudamerica; Oregon es la mas cercana
    # disponible, con latencia extra hacia Supabase (sa-east-1) y los
    # usuarios reales en Rio de Janeiro -- limitacion conocida, no un bug.
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # DATABASE_URL real de Supabase (proyecto rpowardrcwnhbkzjsiok) --
      # sync: false = se carga a mano desde el dashboard de Render, nunca
      # se commitea en este archivo (ver incidente de seguridad previo:
      # una version anterior tenia la contrasena real en texto plano en
      # prompts/combo-VENTANA-1-completa.md).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://lapa-casa-hostel-frontend.onrender.com
      - key: APP_URL
        value: https://lapa-casa-hostel-api.onrender.com
      - key: FRONTEND_URL
        value: https://lapa-casa-hostel-frontend.onrender.com
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: reservas@lapacasahostel.com
      - key: EMAIL_FROM
        value: reservas@lapacasahostel.com
      - key: EMAIL_FROM_NAME
        value: Lapa Casa Hostel
      - key: ADMIN_EMAIL
        sync: false
    autoDeploy: true

  # Frontend Service
  - type: web
    name: lapa-casa-hostel-frontend
    env: static
    region: oregon
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://lapa-casa-hostel-api.onrender.com
      - key: NODE_ENV
        value: production
    autoDeploy: true

# No hay bloque "databases": la base es la Supabase real
# (proyecto rpowardrcwnhbkzjsiok), no una base gestionada por Render.
# DATABASE_URL se carga a mano en el dashboard (ver envVars del backend).
